repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ty does not yet have an official pre-commit mirror; local hook runs
  # whichever version is installed in the project's virtual environment.
  - repo: local
    hooks:
      - id: ty
        name: ty (type checker)
        entry: ty check
        language: system
        types: [python]
        pass_filenames: false
        args: ["src/"]
