    grid-template-columns: minmax(110px, 140px) 1fr minmax(70px, auto);

  .lc-bar-track {

    overflow: hidden;

  }

  .lc-bar-value { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--lc-fg); text-align: right; }

const fmtMoney = (n) => {

  return (n < 0 ? "−$" : "$") + s;
};

};

// -------------------------------------------------------------------------
// CSV EXPORT
// -------------------------------------------------------------------------
function csvEscape(v) {
  if (v == null) return "";
  const s = String(v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function exportCSV(filename, rows, columns) {
  if (!rows || rows.length === 0) {
    antd.message.info("Nothing to export");
    return;
  }
  const header = columns.map(c => csvEscape(c.title)).join(",");
  const body = rows.map(r =>
    columns.map(c => {
      const raw = c.get ? c.get(r) : r[c.key];
      return csvEscape(raw);
    }).join(",")
  ).join("\n");
  const csv = header + "\n" + body;
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function HBarChart({ data, getLabel, getValue, formatValue, emptyText = "No data" }) {
  if (!data || data.length === 0) {
    return <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description={emptyText} />;
  }
  const max = Math.max(...data.map(getValue), 1);
  return (
    <div>
      {data.map((d, i) => {
        const v = getValue(d);
        const pct = (v / max) * 100;
        return (
          <div key={i} className="lc-bar-row">
            <span className="lc-bar-label">{getLabel(d, i)}</span>
            <div className="lc-bar-track">
              <div className="lc-bar-fill" style={{ width: pct + "%" }} />
            </div>
            <span className="lc-bar-value">{formatValue(v, d)}</span>
          </div>
        );
      })}
    </div>
  );
}

function Sparkline({ values, height = 56, dark }) {
  if (!values || values.length < 2) return null;
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const w = 100;
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * w;
    const y = height - ((v - min) / range) * (height - 6) - 3;
    return [x, y];
  });
  const d = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" ");
  const area = d + ` L ${w},${height} L 0,${height} Z`;
  const stroke = dark ? "#a78bfa" : "#6366f1";
  const fill = dark ? "rgba(167,139,250,0.18)" : "rgba(99,102,241,0.16)";
  return (
    <svg className="lc-spark" viewBox={`0 0 ${w} ${height}`} preserveAspectRatio="none">
      <path d={area} fill={fill} />
      <path d={d} fill="none" stroke={stroke} strokeWidth="1.4" vectorEffect="non-scaling-stroke" />
    </svg>
  );
}

function UploadPanel({ onProcessed }) {
  const [phase, setPhase] = useState("idle");
  const [fileName, setFileName] = useState("");
  const [summary, setSummary] = useState(null);

  function startProcess() {
    if (!fileName) return;
    setPhase("loading");
    setTimeout(() => {
      if (/-bad\.xlsx$/i.test(fileName)) {
        setPhase("error"); setSummary(null);
      } else {
        const rows = 4500 + Math.floor(Math.random() * 600);
        const violations = Math.floor(Math.random() * 5);
        const result = { filename:fileName, rows, violations, parsed: rows-4, rejected: 4, clients: 12 };
        setSummary(result); setPhase("success");
        onProcessed?.(result);
      }
    }, 1400);
  }
  function reset() { setPhase("idle"); setFileName(""); setSummary(null); }

  const draggerProps = {
    name: "file", multiple: false, accept: ".xlsx", showUploadList: false,
    beforeUpload(file) { setFileName(file.name); setPhase("idle"); setSummary(null); return false; },
  };

  return (
    <Card
      title={<Space size={10}><span>Upload trade ledger</span><Tag color="blue" style={{ marginLeft: 4 }}>.xlsx</Tag></Space>}
      extra={phase !== "idle" ? <Button size="small" type="text" onClick={reset}>Reset</Button> : null}
    >
      <div className="lc-upload-grid">
        <div>
          <Dragger {...draggerProps} style={{ padding: "12px 0" }}>
            <p className="ant-upload-drag-icon" style={{ marginBottom: 8 }}>
              <span style={{ fontSize: 36, lineHeight: 1 }}>↥</span>
            </p>
            <p className="ant-upload-text" style={{ fontWeight: 600, fontSize: 15 }}>
              Drop an .xlsx file or click to browse
            </p>
            <p className="ant-upload-hint" style={{ fontSize: 13 }}>
              Single file, up to 50&nbsp;MB. Headers must follow Lumina ledger schema v3.
            </p>
          </Dragger>

          {fileName ? (
            <div className="lc-ready-bar">
              <span className="lc-ready-icon">XLSX</span>
              <div className="lc-ready-meta">
                <div className="lc-ready-name" title={fileName}>{fileName}</div>
                <div className="lc-ready-sub">
                  {phase === "loading" ? "Processing…" :
                   phase === "success" ? "Processed successfully" :
                   phase === "error"   ? "Validation failed — see errors below" :
                   "Ready to process"}
                </div>
              </div>
              {phase !== "loading" && phase !== "success" && (
                <Button type="text" size="small" onClick={reset} aria-label="Clear file">✕</Button>
              )}
              <Button
                type="primary" size="large"
                disabled={phase === "loading" || phase === "success"}
                loading={phase === "loading"}
                onClick={startProcess}
              >
                {phase === "success" ? "Processed" : "Upload & Process →"}
              </Button>
            </div>
          ) : (
            <div className="lc-demo-link">
              No file?{" "}
              <Tooltip title="Stages a fake filename ending with -bad.xlsx so you can see the rejection flow.">
                <a onClick={() => setFileName("trades_2026-05-09-bad.xlsx")}>Try a demo rejected file</a>
              </Tooltip>
            </div>
          )}
        </div>

        <div>
          <StatusArea phase={phase} summary={summary} />
        </div>
      </div>

      {phase === "error" && (
        <div style={{ marginTop: 20 }}>
          <Alert
            type="error" showIcon
            message={`File rejected — ${REJECTED_ROWS.length} row(s) failed validation`}
            description="Fix the rows below and re-upload. No data was ingested."
            style={{ marginBottom: 12 }}
          />
          <Table
            className="lc-table lc-err-table"
            size="middle"
            pagination={{ pageSize: 10, size: "small", hideOnSinglePage: true, showSizeChanger: true, pageSizeOptions: ["5","10","20"] }}
            dataSource={REJECTED_ROWS}
            columns={[
              { title:"Row", dataIndex:"row", width:80, className:"num" },
              { title:"Field", dataIndex:"field", width:130 },
              { title:"Value", dataIndex:"value", width:200,
                render: (v) => <span className="mono">{v === "" ? <span className="muted">(empty)</span> : v}</span> },
              { title:"Error", dataIndex:"error" },
            ]}
            locale={{ emptyText: <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="No row errors" /> }}
          />
        </div>
      )}
    </Card>
  );
}

function StatusArea({ phase, summary }) {
  const baseStyle = {
    height: "100%", minHeight: 220,
    border: "1px dashed var(--lc-divider)", borderRadius: 12,
    display: "flex", alignItems: "center", justifyContent: "center", padding: 18,
  };
  if (phase === "idle") {
    return (
      <div style={baseStyle}>
        <div style={{ textAlign:"center" }}>
          <div style={{ fontSize: 28, marginBottom: 8 }}>◷</div>
          <Text type="secondary" style={{ fontSize: 13 }}>
            Awaiting file. Status, summary, and any row errors will appear here.
          </Text>
        </div>
      </div>
    );
  }
  if (phase === "loading") {
    return (
      <div style={{ ...baseStyle, borderStyle: "solid", flexDirection: "column", gap: 14 }}>
        <Spin size="large" />
        <Text type="secondary" style={{ fontSize: 13 }}>Parsing rows, validating ISINs, computing P&amp;L…</Text>
      </div>
    );
  }
  if (phase === "success" && summary) {
    return (
      <div style={{ border: "1px solid var(--lc-divider)", borderRadius: 12, padding: 18, height: "100%" }}>
        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom: 14, flexWrap:"wrap" }}>
          <Tag color="success" style={{ marginRight: 0 }}>Processed</Tag>
          <Text strong className="mono" style={{ fontSize: 12 }}>{summary.filename}</Text>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap: 14 }}>
          <Statistic title="Rows parsed" value={summary.parsed} />
          <Statistic title="Rejected"    value={summary.rejected} valueStyle={{ color:"#dc2626" }} />
          <Statistic title="Violations"  value={summary.violations}
            valueStyle={{ color: summary.violations ? "#d97706" : undefined }} />
          <Statistic title="Clients"     value={summary.clients} />
        </div>
      </div>
    );
  }
  if (phase === "error") {
    return (
      <div style={{ ...baseStyle, borderStyle: "solid", textAlign: "center" }}>
        <div>
          <div style={{ fontSize: 32, color:"#dc2626", lineHeight: 1, marginBottom: 8 }}>⚠</div>
          <Text strong>Validation failed</Text>
          <div><Text type="secondary" style={{ fontSize: 12 }}>See row-level errors below.</Text></div>
        </div>
      </div>
    );
  }
  return null;
}

function UploadHistorySection({ rows, activeKey, onLoad }) {
  const [search, setSearch] = useState("");
  const [dateRange, setDateRange] = useState(null);
  const [statusF, setStatusF] = useState("ALL");
  const [violF, setViolF] = useState("ALL");

  const filtered = useMemo(() => (rows || []).filter((r) => {
    if (search && !r.filename.toLowerCase().includes(search.toLowerCase())) return false;
    if (statusF !== "ALL" && r.status !== statusF) return false;
    if (violF === "WITH" && r.violations === 0) return false;
    if (violF === "NONE" && r.violations > 0) return false;
    if (dateRange && dateRange[0] && dateRange[1]) {
      const d = dayjs(r.date);
      if (d.isBefore(dateRange[0].startOf("day")) || d.isAfter(dateRange[1].endOf("day"))) return false;
    }
    return true;
  }), [rows, search, statusF, violF, dateRange]);

  const columns = [
    { title:"Filename", dataIndex:"filename",
      sorter: (a,b) => a.filename.localeCompare(b.filename),
      render: (v) => <span className="mono">{v}</span> },
    { title:"Date", dataIndex:"date", width:170,
      sorter: (a,b) => dayjs(a.date).valueOf() - dayjs(b.date).valueOf(),
      defaultSortOrder: "descend" },
    { title:"Rows", dataIndex:"rows", width:110, className:"num",
      sorter: (a,b) => a.rows - b.rows,
      render: (v) => fmtNum(v) },
    { title:"Violations", dataIndex:"violations", width:130, className:"num",
      sorter: (a,b) => a.violations - b.violations,
      render: (v) => v === 0
        ? <span className="muted">0</span>
        : <Tag color={v > 3 ? "red" : "orange"} style={{ marginRight: 0 }}>{v}</Tag> },
    { title:"Status", dataIndex:"status", width:120,
      sorter: (a,b) => a.status.localeCompare(b.status),
      render: (s) => s === "Active" ? <Tag color="success">Active</Tag> : <Tag>Inactive</Tag> },
    { title:"", key:"load", width:100, align:"right",
      render: (_, r) => (
        <Button size="small"
          type={r.key === activeKey ? "default" : "primary"}
          ghost={r.key !== activeKey}
          onClick={() => onLoad(r.key)}
          disabled={r.key === activeKey}
        >{r.key === activeKey ? "Loaded" : "Load"}</Button>
      ) },
  ];

  function handleExport() {
    exportCSV("upload-history.csv", filtered, [
      { title:"Filename",   key:"filename" },
      { title:"Date",       key:"date" },
      { title:"Rows",       key:"rows" },
      { title:"Violations", key:"violations" },
      { title:"Status",     key:"status" },
    ]);
  }

  function resetFilters() {
    setSearch(""); setDateRange(null); setStatusF("ALL"); setViolF("ALL");
  }
  const isFiltered = search || dateRange || statusF !== "ALL" || violF !== "ALL";

  return (
    <Card
      size="small"
      title="Upload history"
      extra={<ExportButton disabled={!filtered || filtered.length === 0} onClick={handleExport} />}
    >
      <div style={{ display:"flex", flexWrap:"wrap", gap: 10, alignItems:"center", marginBottom: 14 }}>
        <Input.Search placeholder="Filename…" allowClear value={search}
          onChange={(e) => setSearch(e.target.value)} style={{ width: 200 }} />
        <DatePicker.RangePicker value={dateRange} onChange={setDateRange}
          allowEmpty={[true, true]} style={{ minWidth: 240 }} />
        <Select value={statusF} onChange={setStatusF} style={{ width: 140 }}
          options={[{value:"ALL",label:"All statuses"},{value:"Active",label:"Active"},{value:"Inactive",label:"Inactive"}]} />
        <Select value={violF} onChange={setViolF} style={{ width: 170 }}
          options={[{value:"ALL",label:"All"},{value:"WITH",label:"With violations"},{value:"NONE",label:"No violations"}]} />
        {isFiltered && <Button size="small" type="text" onClick={resetFilters}>Clear</Button>}
        <span className="muted" style={{ marginLeft:"auto", fontSize: 12 }}>{filtered.length} of {rows.length}</span>
      </div>
      <Table
        className="lc-table"
        rowKey="key" size="middle"
        pagination={{ pageSize: 10, size: "small", showSizeChanger: true, pageSizeOptions: ["5","10","20","50"], hideOnSinglePage: true, showTotal: (t, r) => `${r[0]}–${r[1]} of ${t}` }}
        dataSource={filtered}
        columns={columns}
        locale={{ emptyText: <Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description={rows.length === 0 ? "No uploads yet" : "No uploads match the filters"} /> }}
        scroll={{ x: 760 }}
      />
    </Card>
  );
}

  const data = useMemo(() => {
    const rows = client ? (POSITIONS[client] || []) : [];
    return rows.map((p, i) => ({ ...p, key: client + "-" + i }));
  }, [client]);

  const filtered = useMemo(() => data.filter((r) => {
    if (search && !r.isin.toLowerCase().includes(search.toLowerCase())) return false;

  const columns = [

    { title:"Realized P&L", dataIndex:"real", className:"num", width:150,

    { title:"Unrealized P&L", dataIndex:"unreal", className:"num", width:160,

      sorter: (a,b) => a.last - b.last,
      render: (v) => fmtPrice(v) },
  ];

  function handleExport() {
    exportCSV(`positions-${client || "none"}.csv`, filtered, [
      { title:"ISIN",           key:"isin" },
      { title:"Quantity",       key:"qty" },
      { title:"Avg Cost",       key:"avg" },
      { title:"Realized P&L",   key:"real" },
      { title:"Unrealized P&L", key:"unreal" },
      { title:"Last Price",     key:"last" },
    ]);

  const hasClients = CLIENT_IDS.length > 0;

  return (

      title={null}

          value={client} onChange={setClient}

          options={CLIENT_IDS.map((id) => ({ value: id, label: id }))}
        />
        <Input.Search placeholder="ISIN…" allowClear value={search}
          onChange={(e) => setSearch(e.target.value)} style={{ width: 170 }} />
        <Select value={pnlF} onChange={setPnlF} style={{ width: 150 }}
          options={[
            {value:"ALL",label:"All P&L"},
            {value:"GAIN",label:"Gainers"},
            {value:"LOSS",label:"Losers"},

        <div className="lc-positions-totals">

const VIOL_COLORS = { ERROR:"red", FLAG:"orange", WARNING:"gold" };

const TYPE_ORDER = { ERROR: 0, FLAG: 1, WARNING: 2 };

function ViolationsSection() {
  const [clientF, setClientF] = useState("ALL");
  const [typeF, setTypeF] = useState("ALL");
  const [search, setSearch] = useState("");

  const filtered = useMemo(() => VIOLATIONS.filter((v) => {
    if (clientF !== "ALL" && v.client !== clientF) return false;
    if (typeF !== "ALL" && v.type !== typeF) return false;
    if (search) {
      const s = search.toLowerCase();
      if (!v.isin.toLowerCase().includes(s) && !v.description.toLowerCase().includes(s)) return false;
    }
    return true;
  }), [clientF, typeF, search]);

  const counts = VIOLATIONS.reduce((a, v) => { a[v.type] = (a[v.type]||0)+1; return a; }, {});

  const columns = [
    { title:"Client", dataIndex:"client", width:130,

      render: (v) => <span className="mono">{v}</span> },
    { title:"ISIN", dataIndex:"isin", width:160,
      sorter: (a,b) => a.isin.localeCompare(b.isin),
      render: (v) => <span className="mono">{v}</span> },
    { title:"Type", dataIndex:"type", width:120,
      sorter: (a,b) => (TYPE_ORDER[a.type] ?? 99) - (TYPE_ORDER[b.type] ?? 99),
      defaultSortOrder: "ascend",
      render: (t) => <Tag color={VIOL_COLORS[t]} style={{ fontWeight: 600, marginRight: 0 }}>{t}</Tag> },
    { title:"Description", dataIndex:"description",
      sorter: (a,b) => a.description.localeCompare(b.description) },
  ];

  function handleExport() {
    exportCSV("violations.csv", filtered, [
      { title:"Client",      key:"client" },
      { title:"ISIN",        key:"isin" },
      { title:"Type",        key:"type" },
      { title:"Description", key:"description" },
    ]);
  }

  return (
    <Card extra={<ExportButton disabled={filtered.length === 0} onClick={handleExport} />}>
      <div className="lc-violations-toolbar">
        <Select
          value={clientF} onChange={setClientF} style={{ width: 160 }}

            { value:"FLAG",    label:"Flag" },

        <Input.Search placeholder="ISIN or description…" allowClear value={search}
          onChange={(e) => setSearch(e.target.value)} style={{ width: 240 }} />
        <div className="lc-violations-counts">
          <Tag color="red">{counts.ERROR || 0} errors</Tag>
          <Tag color="orange">{counts.FLAG || 0} flags</Tag>
          <Tag color="gold">{counts.WARNING || 0} warnings</Tag>
        </div>
      </div>
      <Table
        className="lc-table"
        rowKey="key" size="middle"
        pagination={{ pageSize: 10, size: "small", showSizeChanger: true, pageSizeOptions: ["5","10","20","50"], hideOnSinglePage: true, showTotal: (t, r) => `${r[0]}–${r[1]} of ${t}` }}
        dataSource={filtered}
        columns={columns}
        scroll={{ x: 720 }}
        locale={{ emptyText:
          <Empty image={Empty.PRESENTED_IMAGE_SIMPLE}
            description={VIOLATIONS.length === 0 ? "No violations recorded" : "No violations match the filters"} />
        }}

    </Card>
  );
}

    components: {
      Layout: {
        headerBg: dark ? "rgba(11,13,18,0.85)" : "rgba(255,255,255,0.85)",
        headerHeight: 64,
        headerPadding: "0 24px",
      },
      Card: {
        headerFontSize: 15,
        headerHeight: 52,
        paddingLG: 24,
      },
      Table: {
        headerBg: dark ? "#161a23" : "#f3f4f6",
        headerColor: dark ? "#cbd5e1" : "#374151",
        rowHoverBg: dark ? "#1a2030" : "#f1f5f9",
        cellFontSize: 15,
        cellPaddingBlock: 14,
      },
      Statistic: { titleFontSize: 12 },
    },
  }), [dark]);

  function handleProcessed(result) {
    const newRow = {
      key: "u-" + Date.now(),
      filename: result.filename,
      date: dayjs().format("YYYY-MM-DD HH:mm"),
      rows: result.rows,
      violations: result.violations,
      status: "Active",
    };
    setHistory([newRow, ...history.map((r) => ({ ...r, status: "Inactive" }))]);
    setActiveKey(newRow.key);
  }
  function handleLoad(key) {
    setActiveKey(key);
    setHistory(history.map((r) => ({ ...r, status: r.key === key ? "Active" : "Inactive" })));
  }

  return (
    <ConfigProvider theme={themeConfig}>
      <Layout style={{ minHeight: "100vh", background: "var(--lc-bg)" }}>
        <Header className="lc-header"
          style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div className="lc-logo">
            <span className="lc-logo-mark"></span>
            <span>Lumina Capital</span>
            <Text type="secondary" style={{ fontSize: 13, marginLeft: 6, fontWeight: 400 }}>
              Transactions
            </Text>
          </div>
          <Space size={10} align="center">
            <Text type="secondary" style={{ fontSize: 13 }}>{dark ? "Dark" : "Light"}</Text>
            <Switch checked={dark} onChange={setDark} checkedChildren="☾" unCheckedChildren="☀" />
          </Space>
        </Header>

        <Content style={{
          padding: "28px 28px 40px",
          maxWidth: 1400, width: "100%", margin: "0 auto",
        }}>
          {/* 1. Upload */}
          <section className="lc-section">
            <UploadPanel onProcessed={handleProcessed} />
          </section>

          {/* 2. Upload history */}
          <section className="lc-section">
            <UploadHistorySection rows={history} activeKey={activeKey} onLoad={handleLoad} />
          </section>

          {/* 3. Positions */}
          <section className="lc-section">
            <div className="lc-section-title">
              <h2>Positions</h2>
              <Text type="secondary" style={{ fontSize: 12 }}>Snapshot · end-of-day</Text>
            </div>
            <PositionsSection />
          </section>

          {/* 4. Violations */}
          <section className="lc-section">
            <div className="lc-section-title">
              <h2>Violations</h2>
              <Text type="secondary" style={{ fontSize: 12 }}>Validated against ledger schema v3</Text>
            </div>
            <ViolationsSection />
          </section>

          {/* 5. Analytics */}
          <section className="lc-section">
            <div className="lc-section-title">
              <h2>Analytics</h2>
              <Text type="secondary" style={{ fontSize: 12 }}>Across loaded ledger</Text>
            </div>
            <AnalyticsSection dark={dark} />
          </section>

          <div style={{ textAlign:"center", padding: "12px 0 4px" }}>
            <Text type="secondary" style={{ fontSize: 11 }}>
              Lumina Capital · prototype · all data illustrative
            </Text>
          </div>
        </Content>
      </Layout>
    </ConfigProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
