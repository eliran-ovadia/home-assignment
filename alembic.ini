# Alembic configuration.
#
# `sqlalchemy.url` is intentionally left blank: migrations/env.py composes the
# URL at runtime from `src.core.config.settings`, so credentials are never
# written to a file checked into version control.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Version files are named like 0001_initial_schema.py — both the rev id and
# a short slug are encoded in the filename so the migration history is
# scannable from a directory listing.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

# sqlalchemy.url is built in env.py — leave blank here.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured. Ruff handles formatting at the project level.

# ── Logging ─────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
