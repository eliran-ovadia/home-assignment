services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assignment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # One-shot migration runner: starts after the DB is healthy, runs
  # `alembic upgrade head`, and exits. The `app` service waits for it
  # to complete successfully before booting (see `service_completed_successfully`
  # below), so the API can never start against an unmigrated schema.
  migrate:
    build: .
    command: alembic upgrade head
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: assignment
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Non-sensitive config passed directly.
      APP_ENV: development
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: assignment
      DB_USER: postgres
      # DB_PASSWORD must be set in the shell or in .env (Compose auto-loads
      # the .env file from the project root).
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # No `volumes: - ./src:/app/src` here — that bind mount was for an
    # earlier "live-reload in dev" pattern; with the React bundle and
    # migrations baked into the image, mounting over /app/src would mask
    # the production layout. For backend hot-reload, run `uvicorn
    # src.api.app:app --reload` locally against `docker compose up db -d`.

volumes:
  postgres_data:
