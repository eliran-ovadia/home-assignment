services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Non-sensitive config passed directly.
      APP_ENV: development
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: assignment
      DB_USER: postgres
      # DB_PASSWORD must be set in the shell: export DB_PASSWORD=...
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    # No `volumes: - ./src:/app/src` here — that bind mount was for an
    # earlier "live-reload in dev" pattern; with the React bundle and
    # migrations baked into the image, mounting over /app/src would mask
    # the production layout. Run `make dev` for live-reload via uvicorn,
    # not `docker compose up`.

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assignment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
